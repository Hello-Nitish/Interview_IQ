name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Syntax and compilation verification
      run: |
        python -m py_compile frontend/app.py
        python -m py_compile utils/database.py
        python -m py_compile utils/pdf_exporter.py
        python -m py_compile agents/case_study_agent.py
        python -m py_compile agents/compensation_negotiator.py
        python -m py_compile agents/cohort_analyzer.py

    - name: Run automated test suite
      run: |
        python -m unittest discover tests
